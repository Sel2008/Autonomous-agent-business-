name: Agent heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-slim
    steps:
      - name: Wake autonomous agent worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://autonomous-agent-business.vercel.app/api/agent/worker"

          curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://autonomous-agent-business.vercel.app/api/bootstrap/worker"
